<app-navbar></app-navbar>

<div class="create-post-container">

  <h2>
    Créer un article
  </h2>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="post-form"
  >

    <mat-form-field appearance="outline">

      <mat-label>
        Topic
      </mat-label>

      <mat-select formControlName="topicId">

        <mat-option
          *ngFor="let topic of topics"
          [value]="topic.id"
        >

          {{ topic.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Titre
      </mat-label>

      <input
        matInput
        formControlName="title"
      />

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Contenu
      </mat-label>

      <textarea
        matInput
        rows="8"
        formControlName="content"
      >
      </textarea>

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
    >

      Créer

    </button>

  </form>

</div>
