<app-navbar></app-navbar>

<div class="feed-container">

  <div class="feed-header">

  <button
  mat-raised-button
  color="primary"
  [routerLink]="['/posts/create']"
>
  Créer un article
</button>

</div>

  <div
    class="posts-grid"
    *ngIf="!loading"
  >

    <mat-card
      class="post-card"
      *ngFor="let post of posts"
    >

      <mat-card-title>
        {{ post.title }}
      </mat-card-title>

      <mat-card-subtitle>

        {{ post.createdAt | date:'dd/MM/yyyy' }}

        •

        {{ post.author }}

      </mat-card-subtitle>

      <mat-card-content>

        <p>
          {{ post.content }}
        </p>

      </mat-card-content>

    </mat-card>

  </div>

</div>
