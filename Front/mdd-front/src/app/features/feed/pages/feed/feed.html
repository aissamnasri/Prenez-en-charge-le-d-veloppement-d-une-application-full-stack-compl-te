<app-navbar></app-navbar>

<div class="feed-container">

  <div class="feed-header">

    <button
      mat-raised-button
      color="primary"
      routerLink="/posts/create"
    >
      Créer un article
    </button>

  </div>

  <div class="posts-grid">

    <mat-card
      class="post-card"
      *ngFor="let post of posts"
      (click)="openPost(post.id)"
    >

      <mat-card-content>

        <h2 class="post-title">
          {{ post.title }}
        </h2>

        <div class="post-meta">

          <span>
            {{ post.createdAt | date:'dd/MM/yyyy' }}
          </span>

          <span>
            •
          </span>

          <span>
            {{ post.author }}
          </span>

        </div>

        <p class="post-content">

          {{ post.content }}

        </p>

      </mat-card-content>

    </mat-card>

  </div>

</div>
