<div class="home-container">

  <div class="logo-container">

    <img
      src="/logo.png"
      alt="MDD Logo"
      class="logo"
    />

  </div>

  <div class="buttons-container">

    <button
      mat-raised-button
      class="login-btn"
      (click)="goToLogin()"
    >
      Se connecter
    </button>

    <button
      mat-raised-button
      color="primary"
      class="register-btn"
      (click)="goToRegister()"
    >
      S'inscrire
    </button>

  </div>

</div>
