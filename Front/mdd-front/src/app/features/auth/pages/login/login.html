<div class="login-container">

  <button
    mat-icon-button
    class="back-button"
    (click)="goBack()"
  >
    <mat-icon>arrow_back</mat-icon>
  </button>

  <img
    src="/logo.png"
    alt="Logo"
    class="logo"
  />

  <h2>Se connecter</h2>

  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="login-form"
  >

    <mat-form-field appearance="outline">

      <mat-label>E-mail ou nom d'utilisateur</mat-label>

      <input
        matInput
        formControlName="emailOrUsername"
      />

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>Mot de passe</mat-label>

      <input
        matInput
        type="password"
        formControlName="password"
      />

    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
    >
      Se connecter
    </button>

  </form>

</div>
