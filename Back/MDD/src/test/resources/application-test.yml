spring:
  datasource:
    url: "jdbc:h2:mem:mdd-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: always

jwt:
  secret: mySuperSecretKeyForJwtAuthenticationMDDProjectTest
  expiration: 86400000

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    com.openclassrooms.mdd: WARN
